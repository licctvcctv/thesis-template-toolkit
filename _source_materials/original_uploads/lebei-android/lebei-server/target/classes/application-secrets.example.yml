# =============================================================================
# 千帆 v2：如何获得「API Key」（控制台提示已不再单独使用应用内 API Key + Secret Key）
# =============================================================================
#
# 官方说明：基于 v2 的接口使用 IAM 的「API Key」鉴权，请求头为
#   Authorization: Bearer bce-v3/ALTAK-xxxx/xxxx
#
# 【推荐】按下面步骤在「安全认证」里创建 API Key（整串复制到 qianfan-api-key）
#
# （1）打开 安全认证 - API Key 列表：
#     https://console.bce.baidu.com/iam/#/iam/apikey/list
#
# （2）点击「创建 API Key」→ 选择服务「千帆 ModelBuilder」（或页面中的千帆相关选项）。
#
# （3）配置资源：选择「所有资源」或绑定你在千帆里创建的具体应用（按控制台说明勾选）。
#
# （4）创建完成后，在列表里复制 **整串** API Key（通常以 bce-v3/ALTAK- 开头），
#     粘贴到下面 qianfan-api-key，**不要**再填 Secret Key。
#
# （5）模型名 qianfan-model 须与你在千帆中已开通的模型一致（文档「文本生成」里的 model 入参），
#     例如 ernie-3.5-8k；若调用报错，到控制台查看可用模型后改此处。
#
# （6）复制本文件为 application-secrets.yml，填好 qianfan-api-key，重启 Spring Boot。
#
# 环境变量方式（任选其一）：
#   $env:QIANFAN_API_KEY="bce-v3/ALTAK-xxx/xxx"
#
# 若你仍希望使用「应用内旧版 API Key + Secret Key + access_token」方式，
# 可在千帆控制台按页面提示「切换至旧版」后，再使用旧版文档对接（本工程当前仅对接 v2）。
#
# =============================================================================

lebei:
  ai:
    # 仅 ASCII；从控制台整串复制，勿写中文说明（否则会 invalid header value）
    qianfan-api-key: "REPLACE_WITH_YOUR_FULL_KEY_FROM_IAM_CONSOLE"
    qianfan-model: "ernie-3.5-8k"
