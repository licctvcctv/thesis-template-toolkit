# YOLOv8s-Ghost-CBAM: Lightweight Backbone + Adaptive Attention
# Innovation 1+2: C2f_Ghost backbone + CBAM after SPPF
#
# CBAM (Convolutional Block Attention Module) applies channel + spatial attention
# after SPPF, allowing the neck to adaptively focus on discriminative features
# while suppressing background clutter — critical for small object detection.
#
# The high-level P5 skip connection from backbone now passes through CBAM (layer 10)
# so attention-refined features propagate into the full FPN.

nc: 10  # VisDrone classes

backbone:
  # [from, n, module, args]
  - [-1, 1, Conv,      [32, 3, 2]]          # 0  P1/2   3→32
  - [-1, 1, Conv,      [64, 3, 2]]          # 1  P2/4   32→64
  - [-1, 1, C2f_Ghost, [64, True]]          # 2         64→64
  - [-1, 1, Conv,      [128, 3, 2]]         # 3  P3/8   64→128
  - [-1, 2, C2f_Ghost, [128, True]]         # 4         128→128
  - [-1, 1, Conv,      [256, 3, 2]]         # 5  P4/16  128→256
  - [-1, 2, C2f_Ghost, [256, True]]         # 6         256→256
  - [-1, 1, Conv,      [512, 3, 2]]         # 7  P5/32  256→512
  - [-1, 1, C2f_Ghost, [512, True]]         # 8         512→512
  - [-1, 1, SPPF,      [512, 5]]            # 9         512→512
  - [-1, 1, CBAM,      [512]]               # 10        512→512  ← adaptive attention

head:
  - [-1,        1, nn.Upsample, [None, 2, "nearest"]]  # 11  512
  - [[-1, 6],   1, Concat,      [1]]                   # 12  512+256=768
  - [-1,        1, C2f,         [256]]                  # 13  768→256

  - [-1,        1, nn.Upsample, [None, 2, "nearest"]]  # 14  256
  - [[-1, 4],   1, Concat,      [1]]                   # 15  256+128=384
  - [-1,        1, C2f,         [128]]                  # 16  384→128  ← P3/8

  - [-1,        1, Conv,        [128, 3, 2]]            # 17  128→128
  - [[-1, 13],  1, Concat,      [1]]                   # 18  128+256=384
  - [-1,        1, C2f,         [256]]                  # 19  384→256  ← P4/16

  - [-1,        1, Conv,        [256, 3, 2]]            # 20  256→256
  - [[-1, 10],  1, Concat,      [1]]                   # 21  256+512=768  (CBAM-refined P5)
  - [-1,        1, C2f,         [512]]                  # 22  768→512  ← P5/32

  - [[16, 19, 22], 1, Detect, [nc]]                    # 23  Detect(P3, P4, P5)
