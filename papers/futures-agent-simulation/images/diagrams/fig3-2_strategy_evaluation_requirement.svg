<text x="800" y="555" text-anchor="middle" font-size="30" font-family="Songti SC, SimSun, Noto Serif CJK SC" fill="#111827">评价结果必须同时展示训练段与测试段，避免只依据历史样本选择策略。</text>
<text x="800" y="608" text-anchor="middle" font-size="26" font-family="Songti SC, SimSun, Noto Serif CJK SC" fill="#334155">核心指标包括总得分、训练得分、测试得分、胜率、最大回撤和动作分布。</text>
