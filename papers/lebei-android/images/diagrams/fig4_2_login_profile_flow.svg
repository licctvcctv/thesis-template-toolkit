<text x="525.0" y="168.2" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#323232">打开App登录页</text>
<line x1="525" y1="89" x2="525" y2="125" stroke="#323232" stroke-width="2.0" fill="none" marker-end="url(#arrow)"/>
<polygon points="525,250 655,295 525,340 395,295" fill="#ffffff" stroke="#212930" stroke-width="2"/>
<text x="525.0" y="302.2" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#323232">已有账号？</text>
