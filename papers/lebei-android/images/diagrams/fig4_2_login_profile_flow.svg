<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1250" viewBox="0 0 1050 1250">
<defs>
<marker id="arrow" viewBox="0 0 14 10" refX="10" refY="5" markerWidth="14" markerHeight="10" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 14 5 L 0 10 Z" fill="#323232" stroke="#323232" stroke-width="1"/>
</marker>
</defs>
<rect x="0" y="0" width="1050" height="1250" fill="#ffffff"/>
<rect x="450" y="35" width="150" height="54" rx="10" fill="#ffffff" stroke="#212930" stroke-width="2.0"/>
<text x="525.0" y="69.2" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#323232">开始</text>
