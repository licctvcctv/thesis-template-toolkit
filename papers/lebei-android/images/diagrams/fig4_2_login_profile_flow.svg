<rect x="370" y="390" width="310" height="62" rx="10" fill="#ffffff" stroke="#212930" stroke-width="2.0"/>
<text x="525.0" y="428.2" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#323232">输入用户名与密码</text>
<line x1="525" y1="340" x2="525" y2="385" stroke="#323232" stroke-width="2.0" fill="none" marker-end="url(#arrow)"/>
<rect x="370" y="510" width="310" height="62" rx="10" fill="#ffffff" stroke="#212930" stroke-width="2.0"/>
<text x="525.0" y="548.2" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#323232">提交登录接口</text>
<line x1="525" y1="452" x2="525" y2="505" stroke="#323232" stroke-width="2.0" fill="none" marker-end="url(#arrow)"/>
<rect x="370" y="630" width="310" height="62" rx="10" fill="#ffffff" stroke="#212930" stroke-width="2.0"/>
<text x="525.0" y="668.2" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#323232">注册并返回Token</text>
<line x1="525" y1="572" x2="525" y2="625" stroke="#323232" stroke-width="2.0" fill="none" marker-end="url(#arrow)"/>
<polygon points="525,750 655,795 525,840 395,795" fill="#ffffff" stroke="#212930" stroke-width="2"/>
<text x="525.0" y="802.2" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#323232">资料是否完整？</text>
<line x1="525" y1="692" x2="525" y2="745" stroke="#323232" stroke-width="2.0" fill="none" marker-end="url(#arrow)"/>
<rect x="370" y="890" width="310" height="62" rx="10" fill="#ffffff" stroke="#212930" stroke-width="2.0"/>
<text x="525.0" y="928.2" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#323232">进入资料完善页</text>
