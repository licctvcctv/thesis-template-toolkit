<line x1="525" y1="1072" x2="525" y2="1125" stroke="#323232" stroke-width="2.0" fill="none" marker-end="url(#arrow)"/>
<rect x="370" y="1250" width="310" height="62" rx="10" fill="#ffffff" stroke="#212930" stroke-width="2.0"/>
