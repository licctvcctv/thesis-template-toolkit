<rect x="370" y="1010" width="310" height="62" rx="10" fill="#ffffff" stroke="#212930" stroke-width="2.0"/>
<text x="525.0" y="1048.2" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#323232">选择年龄、水平、词库</text>
