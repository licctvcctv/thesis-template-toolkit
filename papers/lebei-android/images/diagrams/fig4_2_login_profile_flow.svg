<line x1="525" y1="1192" x2="525" y2="1245" stroke="#323232" stroke-width="2.0" fill="none" marker-end="url(#arrow)"/>
<polyline points="655,295 850,295 850,490 680,490" stroke="#323232" stroke-width="2.0" fill="none" marker-end="url(#arrow)"/>
<text x="710" y="282" text-anchor="start" font-family="Microsoft YaHei, SimSun, Arial" font-size="20" font-weight="700" fill="#323232">否</text>
<text x="535" y="402" text-anchor="start" font-family="Microsoft YaHei, SimSun, Arial" font-size="20" font-weight="700" fill="#323232">是</text>
<polyline points="655,775 850,775 850,1035 680,1035" stroke="#323232" stroke-width="2.0" fill="none" marker-end="url(#arrow)"/>
<text x="710" y="762" text-anchor="start" font-family="Microsoft YaHei, SimSun, Arial" font-size="20" font-weight="700" fill="#323232">是</text>
<text x="535" y="900" text-anchor="start" font-family="Microsoft YaHei, SimSun, Arial" font-size="20" font-weight="700" fill="#323232">否</text>
</svg>